# ---------------------------------------------------------------------------
# JUnit Platform configuration
# ---------------------------------------------------------------------------
# Parallel execution across test CLASSES, sequential inside each class.
#
# Why not parallel inside a class too: several classes here mutate the same
# seeded account (the profile tests in particular). Class-level parallelism gets
# most of the wall-clock win while keeping each class's methods ordered, which
# is the safe default for a UI suite sharing one database.
#
# Each parallel test still gets its own browser — see BaseTest — so there is no
# shared WebDriver to synchronise.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# Cap concurrency so a 16-core laptop does not try to run 16 Chrome instances.
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 3

# Show the @DisplayName text in reports rather than the method name.
junit.jupiter.displayname.generator.default = \
  org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
